name: Bug report
description: Something went wrong, or flame-mcp did something you did not expect.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Only the first box is required: one line is enough, and you can fill in only what you know. You can write in any language.

        Remove anything that you don't want to make public, such as project names, file paths, and client names. Responses and logs can contain them.

        To report a security vulnerability, don't open a public issue. Follow [SECURITY.md](https://github.com/mnt0414/flame-mcp/blob/main/.github/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked the assistant to do, and what happened in Flame.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: dropdown
    id: flame-version
    attributes:
      label: Flame version
      options:
        - "2025.2.4"
        - "2026.2.3"
        - Other (write it under Environment)
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, Python version, and the MCP client (for example Claude Code or Claude Desktop).
    validations:
      required: false
  - type: textarea
    id: operation
    attributes:
      label: Operation and response
      description: The op and its arguments, and the response envelope (with the `errorCode` if there is one).
      render: json
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: Output of scripts/doctor.sh
      description: For a connection problem.
      render: text
    validations:
      required: false
